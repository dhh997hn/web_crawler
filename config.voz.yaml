# voz.vn forum thread list crawl (Cloudflare-protected XenForo)
site:
  name: voz
  base_url: https://voz.vn
  engine: curl_cffi
  impersonate: chrome

login:
  enabled: false                 # dat true khi co account; dien credentials.yaml
  login_type: xf
  login_page: /login/
  endpoint: /login/login
  username_field: login
  password_field: password
  success_check_url: /forums/
  failure_check_marker: "Đăng nhập"
  max_retries: 3
  retry_backoff: 2.0

crawl:
  endpoint: /f/tu-van-cau-hinh.70/
  method: GET
  response_type: html
  page_url_template: "page-{page}"
  start_page: 1
  max_pages: 0
  items_selector: 'div.structItem--thread[class*="js-threadListItem"]'
  served_page_selector: ".pageNav-page--current"
  total_pages_selector: "input.js-pageJumpPage"
  total_pages_attr: "max"
  stop_when_empty: true
  stop_status_codes: [404]
  fields:
    title:
      selector: ".structItem-title a:not(.labelLink)"
      attr: text
    url:
      selector: ".structItem-title a:not(.labelLink)"
      attr: href
      base_url: "https://voz.vn"
    thread_id:
      selector: ".structItem-title a:not(.labelLink)"
      attr: href
      regex: '\.(\d+)/?$'
    author:
      selector: ""
      attr: data-author
    created:
      selector: ".structItem-startDate"
      attr: text
    replies:
      selector: ".structItem-cell--meta .pairs:not(.structItem-minor) dd"
      attr: text
    views:
      selector: ".structItem-cell--meta .pairs.structItem-minor dd"
      attr: text
    last_post_time:
      selector: ".structItem-cell--latest time"
      attr: "data-time"
    last_post_user:
      selector: ".structItem-cell--latest a.username"
      attr: text
  request_delay: 2.0
  timeout: 30
  verify_ssl: true

output:
  format: jsonl
  file: output/voz_threads.jsonl
  csv_columns: []
  checkpoint_file: output/voz_checkpoint.json
  daily_file: true                # them date vao ten file: voz_threads.dd-mm-yyyy.jsonl (1 file/ngay)
